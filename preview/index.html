<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greek Voice Caller Preview</title><style>body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171a}.phone{width:min(390px,100%);min-height:100vh;margin:auto;background:#fff;padding:28px 20px;box-sizing:border-box}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#7557d8}.title{font-size:28px;font-weight:800;margin-top:8px}.card{margin-top:24px;border-radius:28px;padding:24px;background:#f7f4ff;text-align:center}.prompt{font-weight:700}.cmd{font-size:22px;font-weight:800;margin:18px 0 4px}.hint{color:#777}.mic{width:92px;height:92px;border:0;border-radius:50%;background:#7958d9;color:white;font-size:36px;margin:24px auto 10px;display:block}.status{margin-top:16px;padding:16px;border:1px solid #eee;border-radius:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.quick button{border:1px solid #eee;background:#fff;border-radius:18px;padding:14px 6px;font-weight:700}.retry{margin-top:18px;padding:18px;border-radius:20px;background:#f7f7f8}.stop{width:100%;padding:14px;border:0;border-radius:14px;background:#e8e1ff;color:#5e43b7;font-weight:800;margin-top:14px}</style></head><body><main class="phone"><div class="brand">GREEK VOICE CALLER</div><div class="title">Ο φωνητικός σου Caller</div><section class="card"><div class="prompt">🎙 Πες μου τι θέλεις να κάνω</div><div class="cmd">«Πάρε τον Γιώργο»</div><div class="hint">ή «Κάλεσε τη Μαρία»</div><button class="mic" onclick="speak()">🎙</button><div class="hint" id="micHint">Πάτησε και μίλησε στα ελληνικά</div></section><div class="status"><b>● ΚΑΤΑΣΤΑΣΗ</b><div id="status">Πες μου ποιον θέλεις να καλέσω.</div></div><div class="quick"><button>📞<br>Πάρε</button><button onclick="retry()">↻<br>Κάνει<br>επανάκληση</button><button>📼<br>Τηλεφωνητής</button></div><section class="retry"><b>Επανάκληση</b><p>Η επανάκληση δεν ξεκινά μόνη της. Ενεργοποιείται μόνο όταν μου πεις «κάνει επανάκληση».</p><button class="stop" onclick="retry()">↻ Κάνει επανάκληση</button></section></main><script>function speak(){document.getElementById('micHint').textContent='Σε ακούω…';document.getElementById('status').textContent='Άκουσα την εντολή. Αναζητώ την επαφή…'}function retry(){document.getElementById('status').textContent='Ενεργοποίησα την επανάκληση. Θα επαναλάβω μόνο όταν η κλήση δεν απαντηθεί.'}</script></body></html>
